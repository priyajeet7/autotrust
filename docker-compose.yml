# Local PostgreSQL for development and tests.
# Creates two databases: `autotrust` (development) and `autotrust_test` (tests only).
services:
  postgres:
    image: postgres:16-alpine
    container_name: autotrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autotrust
      POSTGRES_PASSWORD: autotrust
      POSTGRES_DB: autotrust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrust -d autotrust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
